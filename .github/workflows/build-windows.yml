name: Build Windows portable executable

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Build portable EXE
        shell: pwsh
        run: |
          $extra = @()

          if (Test-Path "assets/question_bank_cleaner.ico") {
            $extra += "--icon=assets/question_bank_cleaner.ico"
            $extra += "--add-data=assets/question_bank_cleaner.ico;assets"
          }

          if (Test-Path "assets/question_bank_cleaner.png") {
            $extra += "--add-data=assets/question_bank_cleaner.png;assets"
          }

          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name QuestionBankCleaner `
            @extra `
            app.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: QuestionBankCleaner-Windows
          path: dist/QuestionBankCleaner.exe
